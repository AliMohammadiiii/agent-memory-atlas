[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-atlas-demo"
version = "0.1.0"
description = "Offline synthetic reviewer demonstration for Agent Memory Atlas"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.4", "scipy==1.18.1"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.14.14", "mypy==1.19.1"]
analytics = ["scikit-learn==1.9.1", "networkx==3.7", "PyYAML==6.0.3"]

[project.scripts]
atlas-demo = "atlas_demo.__main__:main"
atlas-migrate-query-cache = "atlas_demo.migrate:main"

[tool.setuptools.packages.find]
include = ["atlas_demo*", "scripts*", "server*"]
namespaces = true

[tool.setuptools.package-data]
atlas_demo = ["corpus.json", "report.html"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scripts.*", "server.*"]
follow_imports = "skip"
