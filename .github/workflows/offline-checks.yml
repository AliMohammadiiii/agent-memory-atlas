name: Offline source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt '.[dev]' build
      - run: ruff check atlas_demo tests benchmarks --select E4,E7,E9,F
      - run: ruff format --check atlas_demo tests benchmarks scripts/analytics_final.py scripts/build_site.py server/fulltext.py
      - run: mypy atlas_demo
      - run: python -m pytest -p no:cacheprovider scripts server tests -q
        env:
          PYTHONPATH: .:scripts:server
          PYTHONDONTWRITEBYTECODE: '1'
      - run: atlas-demo --output "$RUNNER_TEMP/atlas-demo" --react-data "$RUNNER_TEMP/atlas-react-data" && atlas-demo --output "$RUNNER_TEMP/atlas-demo"
      - run: python -c "import json,os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'atlas-demo'; r=json.loads((p/'report.json').read_text()); assert r['cache']=={'hits':3,'misses':0}; assert (p/'index.html').exists()"
      - run: python -m build --wheel --outdir "$RUNNER_TEMP/atlas-wheel"
      - run: python -m venv "$RUNNER_TEMP/wheel-env" && "$RUNNER_TEMP/wheel-env/bin/pip" install "$RUNNER_TEMP"/atlas-wheel/*.whl && cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel-env/bin/atlas-demo" --output "$RUNNER_TEMP/wheel-demo"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run format:check
      - run: npm run build
